<svg id="fixture-series" width="220" xmlns="http://www.w3.org/2000/svg" viewBox="190 -7 220 974" height="974" role="graphics-document document" aria-roledescription="circuitDiagram"><style>#fixture-series{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixture-series .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixture-series .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixture-series .error-icon{fill:#552222;}#fixture-series .error-text{fill:#552222;stroke:#552222;}#fixture-series .edge-thickness-normal{stroke-width:1px;}#fixture-series .edge-thickness-thick{stroke-width:3.5px;}#fixture-series .edge-pattern-solid{stroke-dasharray:0;}#fixture-series .edge-thickness-invisible{stroke-width:0;fill:none;}#fixture-series .edge-pattern-dashed{stroke-dasharray:3;}#fixture-series .edge-pattern-dotted{stroke-dasharray:2;}#fixture-series .marker{fill:#333333;stroke:#333333;}#fixture-series .marker.cross{stroke:#333333;}#fixture-series svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#fixture-series p{margin:0;}#fixture-series .node .neo-node{stroke:#9370DB;}#fixture-series [data-look="neo"].node rect,#fixture-series [data-look="neo"].cluster rect,#fixture-series [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-series [data-look="neo"].swimlane.cluster rect{filter:none;}#fixture-series [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#fixture-series [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-series [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#fixture-series [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-series [data-look="neo"].node circle .state-start{fill:#000000;}#fixture-series [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-series [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-series :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g data-circuit="drawing"><g data-layer="frames"><rect x="210" y="210" width="180" height="540" fill="none" stroke="#777" stroke-width="1" data-stage="0" stroke-dasharray="6 4"></rect><text x="215" y="205" fill="black" stroke="none" font-size="12" font-family="sans-serif"><tspan x="215" dy="0">series</tspan></text></g><g fill="none" stroke="black" stroke-width="2" stroke-linecap="round" data-layer="wires"><g data-net="VDD"><path d="M 300 120 L 300 150"></path><path d="M 300 240 L 300 210"></path><path d="M 300 210 L 300 150"></path></g><g data-net="GND"><path d="M 300 840 L 300 810"></path><path d="M 300 720 L 300 750"></path><path d="M 300 750 L 300 810"></path></g><g data-net="@implicit:R1:B"><path d="M 300 360 L 300 390"></path><path d="M 300 420 L 300 390"></path></g><g data-net="@implicit:R2:B"><path d="M 300 540 L 300 570"></path><path d="M 300 600 L 300 570"></path></g></g><g data-layer="symbols"><g transform="matrix(6.123233995736766e-17 1 -1 6.123233995736766e-17 360 240)" data-symbol="resistor" data-device="R1">
