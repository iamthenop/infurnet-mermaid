<svg id="fixture-shared-input" width="702" xmlns="http://www.w3.org/2000/svg" viewBox="24 -36 702 476" height="476" role="graphics-document document" aria-roledescription="circuitDiagram"><style>#fixture-shared-input{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixture-shared-input .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixture-shared-input .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixture-shared-input .error-icon{fill:#552222;}#fixture-shared-input .error-text{fill:#552222;stroke:#552222;}#fixture-shared-input .edge-thickness-normal{stroke-width:1px;}#fixture-shared-input .edge-thickness-thick{stroke-width:3.5px;}#fixture-shared-input .edge-pattern-solid{stroke-dasharray:0;}#fixture-shared-input .edge-thickness-invisible{stroke-width:0;fill:none;}#fixture-shared-input .edge-pattern-dashed{stroke-dasharray:3;}#fixture-shared-input .edge-pattern-dotted{stroke-dasharray:2;}#fixture-shared-input .marker{fill:#333333;stroke:#333333;}#fixture-shared-input .marker.cross{stroke:#333333;}#fixture-shared-input svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#fixture-shared-input p{margin:0;}#fixture-shared-input .node .neo-node{stroke:#9370DB;}#fixture-shared-input [data-look="neo"].node rect,#fixture-shared-input [data-look="neo"].cluster rect,#fixture-shared-input [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-shared-input [data-look="neo"].swimlane.cluster rect{filter:none;}#fixture-shared-input [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#fixture-shared-input [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-shared-input [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#fixture-shared-input [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-shared-input [data-look="neo"].node circle .state-start{fill:#000000;}#fixture-shared-input [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-shared-input [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-shared-input :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g data-circuit="drawing"><g data-layer="frames"><rect x="180" y="0" width="420" height="420" fill="none" stroke="#777" stroke-width="1" data-block="0"></rect><text x="185" y="-5" fill="black" stroke="none" font-size="12" font-family="sans-serif"><tspan x="185" dy="0">logic</tspan></text><rect x="210" y="30" width="360" height="360" fill="none" stroke="#777" stroke-width="1" data-stage="0" stroke-dasharray="6 4"></rect><text x="215" y="25" fill="black" stroke="none" font-size="12" font-family="sans-serif"><tspan x="215" dy="0">drivers</tspan></text></g><g fill="none" stroke="black" stroke-width="2" stroke-linecap="round" data-layer="wires"><g data-net="A"><path d="M 120 120 L 150 120"></path><path d="M 240 120 L 210 120"></path><path d="M 210 120 L 200 120"></path><path d="M 200 120 L 150 120"></path><path d="M 420 300 L 390 300"></path><path d="M 390 300 L 200 300"></path><path d="M 200 300 L 200 120"></path><circle cx="200" cy="120" r="3" fill="black" data-junction="A"></circle></g><g data-net="Y"><path d="M 630 120 L 600 120"></path><path d="M 360 120 L 390 120"></path><path d="M 390 120 L 600 120"></path></g><g data-net="Z"><path d="M 630 300 L 600 300"></path><path d="M 540 300 L 570 300"></path><path d="M 570 300 L 600 300"></path></g></g><g data-layer="symbols"><g transform="matrix(1 0 0 1 240 60)" data-symbol="inverter"