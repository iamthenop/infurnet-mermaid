<svg id="fixture-parallel" width="400" xmlns="http://www.w3.org/2000/svg" viewBox="190 -187 400 614" height="614" role="graphics-document document" aria-roledescription="circuitDiagram"><style>#fixture-parallel{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixture-parallel .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixture-parallel .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixture-parallel .error-icon{fill:#552222;}#fixture-parallel .error-text{fill:#552222;stroke:#552222;}#fixture-parallel .edge-thickness-normal{stroke-width:1px;}#fixture-parallel .edge-thickness-thick{stroke-width:3.5px;}#fixture-parallel .edge-pattern-solid{stroke-dasharray:0;}#fixture-parallel .edge-thickness-invisible{stroke-width:0;fill:none;}#fixture-parallel .edge-pattern-dashed{stroke-dasharray:3;}#fixture-parallel .edge-pattern-dotted{stroke-dasharray:2;}#fixture-parallel .marker{fill:#333333;stroke:#333333;}#fixture-parallel .marker.cross{stroke:#333333;}#fixture-parallel svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#fixture-parallel p{margin:0;}#fixture-parallel .node .neo-node{stroke:#9370DB;}#fixture-parallel [data-look="neo"].node rect,#fixture-parallel [data-look="neo"].cluster rect,#fixture-parallel [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-parallel [data-look="neo"].swimlane.cluster rect{filter:none;}#fixture-parallel [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#fixture-parallel [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-parallel [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#fixture-parallel [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-parallel [data-look="neo"].node circle .state-start{fill:#000000;}#fixture-parallel [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-parallel [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-parallel :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g data-circuit="drawing"><g data-layer="frames"><rect x="210" y="30" width="360" height="180" fill="none" stroke="#777" stroke-width="1" data-stage="0" stroke-dasharray="6 4"></rect><text x="215" y="25" fill="black" stroke="none" font-size="12" font-family="sans-serif"><tspan x="215" dy="0">parallel</tspan></text></g><g fill="none" stroke="black" stroke-width="2" stroke-linecap="round" data-layer="wires"><g data-net="VDD"><path d="M 300 60 L 300 10"></path><path d="M 300 -60 L 300 -30"></path><path d="M 300 -30 L 300 10"></path><path d="M 480 60 L 480 10"></path><path d="M 480 10 L 300 10"></path><circle cx="300" cy="10" r="3" fill="black" data-junction="VDD"></circle></g><g data-net="GND"><path d="M 300 180 L 300 230"></path><path d="M 300 300 L 300 270"></path><path d="M 300 270 L 300 230"></path><path d="M 480 180 L 480 230"></path><path d="M 480 230 L 300 230"></path><circle cx="300" cy="230" r="3" fill="black" data-junction="GND"></circle></g></g><g data-layer="symbols"><g transform="matrix(6.123233995736766e-17 1 -1 6.123233995736766e-17 360 59.99999999999999)" data-symbol="resistor" data-device="R1">
