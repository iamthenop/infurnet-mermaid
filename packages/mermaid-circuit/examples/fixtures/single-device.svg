<svg id="fixture-single-device" width="220" xmlns="http://www.w3.org/2000/svg" viewBox="190 10 220 220" height="220" role="graphics-document document" aria-roledescription="circuitDiagram"><style>#fixture-single-device{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixture-single-device .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixture-single-device .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixture-single-device .error-icon{fill:#552222;}#fixture-single-device .error-text{fill:#552222;stroke:#552222;}#fixture-single-device .edge-thickness-normal{stroke-width:1px;}#fixture-single-device .edge-thickness-thick{stroke-width:3.5px;}#fixture-single-device .edge-pattern-solid{stroke-dasharray:0;}#fixture-single-device .edge-thickness-invisible{stroke-width:0;fill:none;}#fixture-single-device .edge-pattern-dashed{stroke-dasharray:3;}#fixture-single-device .edge-pattern-dotted{stroke-dasharray:2;}#fixture-single-device .marker{fill:#333333;stroke:#333333;}#fixture-single-device .marker.cross{stroke:#333333;}#fixture-single-device svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#fixture-single-device p{margin:0;}#fixture-single-device .node .neo-node{stroke:#9370DB;}#fixture-single-device [data-look="neo"].node rect,#fixture-single-device [data-look="neo"].cluster rect,#fixture-single-device [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-single-device [data-look="neo"].swimlane.cluster rect{filter:none;}#fixture-single-device [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#fixture-single-device [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 