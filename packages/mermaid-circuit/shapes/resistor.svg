<?xml version="1.0" encoding="UTF-8"?>
<!--
  resistor: vertical IEEE zigzag resistor.
  Pane 1:1.
  Terminals A (60, 0), B (60, 120).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="120" height="120" viewBox="0 0 120 120">
  <g id="resistor" fill="none" stroke="#000"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line id="lead-a" x1="60" y1="0" x2="60" y2="30"/>
    <polyline id="body" points="60,30 80,35 40,45 80,55 40,65 80,75 40,85 60,90"/>
    <line id="lead-b" x1="60" y1="90" x2="60" y2="120"/>
  </g>
</svg>
