<?xml version="1.0" encoding="UTF-8"?>
<!--
  vdd: supply rail.
  Pane 1:1.
  No terminals. Attaches to its net at (60, 120).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="120" height="120" viewBox="0 0 120 120">
  <g id="vdd" fill="none" stroke="#000"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line id="stem" x1="60" y1="120" x2="60" y2="30"/>
    <line id="bar" x1="30" y1="30" x2="90" y2="30"/>
  </g>
</svg>
