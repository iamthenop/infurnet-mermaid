<?xml version="1.0" encoding="UTF-8"?>
<!--
  pin-in: input pin flag.
  Pane 1:1.
  No terminals. Attaches to its net at (120, 60).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="120" height="120" viewBox="0 0 120 120">
  <g id="pin-in" fill="none" stroke="#000"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon id="body" points="15,30 90,30 105,60 90,90 15,90"/>
    <line id="stem" x1="105" y1="60" x2="120" y2="60"/>
  </g>
</svg>
