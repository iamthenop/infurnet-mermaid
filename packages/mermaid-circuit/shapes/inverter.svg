<?xml version="1.0" encoding="UTF-8"?>
<!--
  inverter: inverter.
  Pane 1:1.
  Terminals I (0, 60), O (120, 60).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="120" height="120" viewBox="0 0 120 120">
  <g id="inverter" fill="none" stroke="#000"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line id="lead-i" x1="0" y1="60" x2="24" y2="60"/>
    <polygon id="body" points="24,24 24,96 84,60"/>
    <circle id="bubble" cx="90" cy="60" r="6" fill="#fff"/>
    <line id="lead-o" x1="96" y1="60" x2="120" y2="60"/>
  </g>
</svg>
